<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scelta del nuovo computer</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1124;--tx:#f3f5fc;--mu:#9aa6c4;--c1:#5ad1f5;--c2:#b693ff;--c3:#46e0a0;--c4:#ffb85c;--gl:rgba(255,255,255,.06);--bd:rgba(255,255,255,.11);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:400 16px/1.5 'DM Sans',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;margin:0;line-height:1.08;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bg{position:fixed;inset:0;overflow:hidden;z-index:0}
.bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.38;animation:fl 18s ease-in-out infinite alternate}
.bg i:nth-child(1){width:60vmax;height:60vmax;background:#2b6cff;left:-20vmax;top:-18vmax}
.bg i:nth-child(2){width:50vmax;height:50vmax;background:#8a4dff;right:-18vmax;top:20vh;animation-delay:-6s}
.bg i:nth-child(3){width:40vmax;height:40vmax;background:#12b886;left:20vw;bottom:-22vmax;opacity:.22;animation-delay:-11s}
@keyframes fl{to{transform:translate(6vmax,5vmax) scale(1.15)}}
#pg{position:fixed;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3));transform-origin:left;transform:scaleX(0);transition:transform .6s cubic-bezier(.2,.8,.2,1);z-index:20}
#st{position:relative;height:100%;z-index:1}
.slide{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;padding:34px 20px 120px;opacity:0;visibility:hidden;transform:translateX(calc(var(--d,1)*70px));transition:opacity .5s,transform .7s cubic-bezier(.2,.8,.2,1),visibility 0s .7s}
.slide.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.slide.out{transform:translateX(calc(var(--d,1)*-70px))}
.w{position:relative;z-index:1;margin:auto;width:100%;max-width:1060px;display:flex;flex-direction:column;gap:20px}
.a{opacity:0}
.on .a{animation:up .75s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms + 120ms)}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.gl{background:var(--gl);border:1px solid var(--bd);border-radius:22px;padding:18px 20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
h2{font-size:clamp(26px,5.4vw,46px);font-weight:800}
.vd{color:var(--mu);font-size:clamp(15px,2.4vw,19px);max-width:62ch}
.bd{display:inline-flex;align-items:center;justify-content:center;line-height:1;gap:8px;padding:7px 14px;border-radius:99px;background:var(--gl);border:1px solid var(--bd);font-size:14px;color:var(--mu);width:fit-content}
.bd.g{background:rgba(70,224,160,.14);border-color:rgba(70,224,160,.5);color:var(--c3);font-weight:700}
.hd{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* cover */
.cv h1{font-size:clamp(40px,10.5vw,104px);font-weight:800;background:linear-gradient(100deg,#fff 20%,var(--c1) 55%,var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;overflow-wrap:anywhere}
.on .cv h1,.on.cv h1{animation:trk 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes trk{from{letter-spacing:.12em;opacity:0;filter:blur(8px)}to{letter-spacing:-.02em;opacity:1;filter:none}}
.cv .sub{font-size:clamp(18px,3.4vw,28px);color:var(--c1);font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:600}
.cv .q{font-size:clamp(16px,2.6vw,21px);color:var(--mu);max-width:44ch}
.orb{position:absolute;z-index:0;pointer-events:none;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--gl);border:1px solid var(--bd);backdrop-filter:blur(10px);animation:bob 6s ease-in-out infinite alternate;color:var(--c1)}
.orb svg{width:46%;height:46%}
@keyframes bob{to{transform:translateY(-18px) rotate(6deg)}}
.hint{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:15px}
.hint b{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--gl);border:1px solid var(--bd);align-items:center;justify-content:center;color:var(--tx);animation:nud 1.6s ease-in-out infinite}
@keyframes nud{50%{transform:translateX(6px)}}
/* areas */
.ar{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:14px}
.ar .gl{display:flex;flex-direction:column;gap:10px}
.ic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--k) 18%,transparent);color:var(--k);font-size:24px}
.ar h3{font-size:20px}.ar p{color:var(--mu);font-size:15px}
/* model */
.g{display:grid;grid-template-columns:1fr;gap:16px}
.pr{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:clamp(52px,14vw,104px);line-height:1;letter-spacing:-.03em;background:linear-gradient(100deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.rw{display:flex;gap:12px;align-items:flex-start;color:var(--mu);font-size:16px}
.rw svg{margin-top:3px;color:var(--c1)}.rw b{color:var(--tx)}
.us{border-radius:18px;padding:14px 16px;background:rgba(255,184,92,.1);border:1px solid rgba(255,184,92,.4);font-size:15px;color:#ffe3bd}
.us b{color:var(--c4)}
.sp{display:flex;flex-direction:column;padding:6px 20px}
.sp div{display:flex;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd)}
.sp div:last-child{border:0}
.sp svg{color:var(--c1);font-size:20px}
.sp span{width:104px;flex:none;color:var(--mu);font-size:14px}
.sp b{font-weight:500;font-size:16px;min-width:0;overflow-wrap:anywhere}
.pc{display:grid;grid-template-columns:1fr;gap:14px}
.pc h3{font-size:18px;display:flex;gap:10px;align-items:center;margin-bottom:8px}
.pc ul,.ok ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.pc li{position:relative;padding-left:20px;font-size:15px}
.pc li::before{content:"";position:absolute;left:2px;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--k)}
.pro{--k:var(--c3)}.pro h3{color:var(--c3)}.con{--k:var(--c4)}.con h3{color:var(--c4)}
/* compare */
.cm{padding:8px 18px}
.cm .r{padding:12px 0;border-bottom:1px solid var(--bd);display:flex;flex-direction:column;gap:6px}
.cm .r:last-child{border:0}
.cm .r.h{display:none}
.cm .r>b{color:var(--mu);font-weight:500;font-size:14px}
.cm .r span{font-size:15px;display:flex;gap:8px}
.cm .r span::before{content:attr(data-n);flex:none;width:92px;color:var(--m);font-weight:700;font-size:13px;padding-top:2px}
.cm .y{color:var(--c3)}.cm .n{color:var(--c4)}
.tg{display:grid;grid-template-columns:1fr;gap:12px}
.tg .gl{padding:14px 18px}.tg small{color:var(--mu);font-size:14px;display:block}.tg h3{font-size:20px;color:var(--k)}
/* rank */
.pd{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:230px}
.pd div{width:min(30%,150px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;text-align:center;font-size:13px;height:100%;position:relative}
.pd .bar{width:100%;border-radius:16px 16px 6px 6px;background:linear-gradient(180deg,var(--k),color-mix(in srgb,var(--k) 35%,transparent));display:flex;justify-content:center;padding-top:8px;font:800 34px 'Bricolage Grotesque',sans-serif;color:#0e1124;transform-origin:bottom;transform:scaleY(0)}
.on .pd .bar{animation:gr 1s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:calc(var(--i,0)*120ms + 500ms)}
@keyframes gr{to{transform:none}}
.pd b{font-size:14px;line-height:1.2}.pd em{font-style:normal;color:var(--c1);font-weight:700}
.rk{display:flex;flex-direction:column;gap:10px}
.rk .gl{display:flex;gap:14px;align-items:center;padding:12px 16px;border-radius:18px}
.rk i{flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 16px 'Bricolage Grotesque',sans-serif;font-style:normal;background:rgba(255,255,255,.1)}
.rk i.t{background:var(--c1);color:#0e1124}
.rk b{display:block;font-size:15px;overflow-wrap:anywhere}.rk p{font-size:14px;color:var(--mu)}
.nt{color:var(--mu);font-size:14px;font-style:italic}
/* why / final */
.wy{display:grid;grid-template-columns:1fr;gap:16px}
.ck{display:flex;flex-direction:column;gap:12px}
.ck div{display:flex;gap:12px;align-items:flex-start;font-size:16px}
.ck svg{color:var(--c3);font-size:22px;margin-top:1px}
.on .ck .pop svg{animation:pp .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i,0)*70ms + 450ms)}
@keyframes pp{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.big{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;padding:26px 20px}
.big .pr{font-size:clamp(54px,13vw,88px)}
.qt{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:clamp(18px,3vw,26px);font-weight:600;line-height:1.3;max-width:34ch}
.op{display:grid;grid-template-columns:1fr;gap:14px}
.op .gl{display:flex;flex-direction:column;gap:8px}.op h3{font-size:22px;color:var(--k)}.op p{color:var(--mu);font-size:15px}
.cl{display:grid;grid-template-columns:1fr;gap:12px}
.pk{display:grid;grid-template-columns:1fr;gap:14px}.pk label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
.pk select{font:500 16px 'DM Sans',system-ui,sans-serif;color:var(--tx);background:rgba(255,255,255,.08);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;width:100%;min-height:52px}
.pk select:focus-visible{outline:3px solid var(--c1);outline-offset:2px}.pk option{background:#1a1f3a;color:#fff}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:10px;align-self:stretch;padding:15px 28px;border-radius:99px;border:0;font:700 17px 'DM Sans',system-ui,sans-serif;color:#0e1124;background:linear-gradient(135deg,var(--c1),var(--c2));cursor:pointer;box-shadow:0 8px 30px rgba(90,209,245,.3);transition:transform .2s}
.bt:active{transform:scale(.96)}.bt:focus-visible{outline:3px solid var(--c1);outline-offset:3px}.bt.gh{background:var(--gl);color:var(--tx);border:1px solid var(--bd);box-shadow:none;align-self:center;margin-top:6px}
.cx{display:flex;flex-direction:column;gap:14px;animation:up .6s cubic-bezier(.2,.8,.2,1) both}
.hdr{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hdr>div{background:var(--gl);border:1px solid var(--bd);border-radius:18px;padding:14px;min-width:0}
.hdr small{color:var(--k);font-weight:700}.hdr h3{font-size:clamp(15px,2.4vw,20px);margin:4px 0 6px;overflow-wrap:anywhere}.hdr .pr2{font:800 clamp(22px,5vw,34px) 'Bricolage Grotesque',system-ui,sans-serif;color:var(--k)}
.cm.cc .r span::before{width:24px}.pcs{display:grid;grid-template-columns:1fr;gap:14px}.cmx{text-align:center;color:var(--c4)}.club{font-size:13px;line-height:1.45;color:var(--mu)}.club b{color:var(--c1);font-weight:700}
/* nav */
.nb{position:fixed;z-index:30;width:58px;height:58px;border-radius:50%;border:1px solid var(--bd);background:rgba(255,255,255,.1);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .25s,opacity .3s,background .25s;font-size:26px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
#pv{left:16px}#nx{right:16px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#0e1124;border:0;box-shadow:0 8px 30px rgba(90,209,245,.35)}
#nx::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--c1);animation:rg 2s ease-out infinite}
@keyframes rg{from{transform:scale(1);opacity:.7}to{transform:scale(1.5);opacity:0}}
.nb:active{transform:scale(.9)}
.nb.h{opacity:0;pointer-events:none;transform:scale(.6)}
.nb:focus-visible{outline:3px solid var(--c1);outline-offset:3px}
#ct{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 34px);font-size:14px;color:var(--mu);background:var(--gl);border:1px solid var(--bd);padding:6px 14px;border-radius:99px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
@media(min-width:720px){
 .slide{padding:44px 120px 60px}
 .nb{bottom:auto;top:50%;margin-top:-29px}
 .nb:active{transform:scale(.9)}
 #pv{left:30px}#nx{right:30px}
 #ct{bottom:22px}
 .g{grid-template-columns:5fr 6fr;gap:26px;align-items:start}
 .pc{grid-template-columns:1fr 1fr}
 .tg,.op{grid-template-columns:repeat(3,1fr)}
 .cl{grid-template-columns:1fr 1fr}
 .wy{grid-template-columns:6fr 4fr;align-items:center}
 .cm{padding:6px 22px}
 .cm .r{display:grid;grid-template-columns:1.1fr 1.4fr 1.4fr 1.4fr;gap:14px;align-items:center;padding:9px 0}
 .cm .r span::before{display:none}
 .cm.cc .r{grid-template-columns:1fr 2fr 2fr}.pk{grid-template-columns:1fr 1fr}.bt{align-self:flex-start}.bt.gh{align-self:center}.pcs{grid-template-columns:1fr 1fr}
 .cm .r.h{display:grid}
 .cm .r.h span{font:700 16px 'Bricolage Grotesque',sans-serif;color:var(--m)}
 .rk{display:grid;grid-template-columns:1fr 1fr;gap:10px}
}
@media(min-width:720px) and (max-height:760px){.slide{padding-top:28px}.w{gap:14px}.cm .r{padding:6px 0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}.a{opacity:1}.pd .bar{transform:none}}
</style>
</head>
